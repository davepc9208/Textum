<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- SEO base -->
    <title>TEXTUM — Mentoría Académica Internacional</title>
    <meta name="description" content="Programas de mentoría académica para titulación, publicación científica y defensa oral. Rigor metodológico, uso ético de IA. Diagnóstico gratuito." />

    <!-- Open Graph -->
    <meta property="og:type"         content="website" />

    <meta name="twitter:image:alt"   content="TEXTUM — Mentoría Académica Internacional" />

    <!-- Theme -->
    <meta name="theme-color" content="#0d1f3c" />

    <!--
      FUENTES — estrategia de máximo rendimiento:
      · preconnect a los 2 orígenes de Google Fonts
      · preconnect a Pexels (imagen LCP en About)
      · ELIMINADO: preconnect a ipapi.co (ya no se usa; reemplazado por cdn-cgi/trace)
      · preload del CSS de fuentes como stylesheet diferido (no bloquea render)
      · Solo 3 variantes de Cormorant: 300, 400 italic, 600
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.pexels.com" />
    <link rel="preconnect" href="https://didxrqnhnxbhskdazkzz.supabase.co" />

    <!-- Fuentes reducidas: solo las variantes realmente usadas -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Inter:wght@300;400;500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Inter:wght@300;400;500&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

    <!-- JSON-LD: FAQPage — aparece en Google como fragmento enriquecido -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿TEXTUM escribe tesis completas?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. TEXTUM acompaña metodológicamente al investigador para que sea el propio autor quien construya y firme su investigación. La autoría intelectual pertenece siempre al investigador."
          }
        },
        {
          "@type": "Question",
          "name": "¿TEXTUM ayuda a publicar en Scopus?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. El programa Pre-arbitraje Científico + FLUX® está diseñado específicamente para optimizar manuscritos antes del envío a revistas Scopus, maximizando la probabilidad de aceptación."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuánto cuesta la mentoría de TEXTUM?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Los precios de referencia van desde 110 EUR (defensa oral) hasta 750 EUR (publicación premium). El diagnóstico inicial es gratuito. Todos los pagos son únicos, sin cuotas ni renovaciones."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo empieza el proceso con TEXTUM?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Con un diagnóstico académico gratuito donde se evalúa el estado del proyecto y se orienta al investigador hacia el programa más adecuado. Se puede solicitar en mentoriatextum.com o por WhatsApp al +34 614 63 84 06."
          }
        },
        {
          "@type": "Question",
          "name": "¿TEXTUM trabaja con investigadores de toda América Latina?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. TEXTUM opera internacionalmente con presencia en España, Ecuador, Perú, México, Colombia, Argentina y otros países hispanohablantes. Todas las sesiones son 100% online."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué diferencia a TEXTUM de una correctora tradicional?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Una correctora mejora la forma del texto. TEXTUM trabaja en profundidad sobre la arquitectura metodológica, la coherencia interna y la argumentación científica, formando al investigador para que comprenda y defienda cada decisión de su trabajo."
          }
        }
      ]
    }
    </script>
